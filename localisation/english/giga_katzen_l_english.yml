l_english:
 giga_katzen.05000.name:0 "Strategic Shifts on Flusion"
 giga_katzen.05000.desc:0 "Recent reports from the Katzenartig Imperium all suggest that a strategic and political shift is underway. The Kaiser seems to believe that Flusion's rule has expanded far enough for the time being, and is ordering his aides to draft an array of plans for substantial administrative restructuring.\n\nWhile we shouldn't expect anything like a renunciation of Katzen militarism, it seems a respite is on the horizon for free nations on the Imperium's borders - and a tighter grip is closing for those who are already under the Kaiser's thumb.\n\nPractically, this means the Kaiser is seeking to wind down ongoing conflicts in the coming years, and will reign in his relentless expansionism. We should review the galactic situation with our new intel in case this provides any opportunities."
 giga_katzen.05001.name:0 "Katzenartig Restructuring Begins"
 giga_katzen.05001.desc:0 "Increasingly public information from the Katzenartig Imperium confirms that the Kaiser has gone ahead with his once-clandestine reformation plans. According to our best intel, we should expect the Kaiser to spend upwards of two decades occupied with enacting a range of far-reaching administrative reforms designed to consolidate Flusion's local and imperial authority.\n\nReform is, of course, risky business, with programs such as accelerating Katzenification and reshuffling regional political privileges particularly likely to cause backlash. Whether the Kaiser can come out of this era with his reign strengthened will depend heavily on whether his citizens and subordinates feel he has fulfilled his promises..."
 giga_katzen.05010.name:0 "Instability in Katzenartig Imperium!"
 giga_katzen.05010.desc:0 "It appears that the Katzenartig citizenry don't feel the Kaiser is delivering his utopian vision. Open unrest has broken out on the capital itself, and while the Kaiser has responded with a heavy hand to reassert his authority, a spike in high-profile treason convictions suggests that not all in the Imperium's upper echelons are still willing to enforce the Kaiser's decrees.\n\nDespite this test to the Kaiser's rule, it's still too soon to say whether the Kaiserist government will collapse, or reassert itself for another generation - and with the crisis playing out on numerous societal battlefields, it may be a few years before we have an answer.\n\nRegardless, during this period, the Katzenartig Imperium may not have the capacity to handle further threats, and a war could help stretch the Katzen government too far..."
 giga_katzen.05011.name:0 "Kaiser Maintains Power"
 giga_katzen.05011.desc:0 "Recent unrest in the Katzenartig Imperium has wound down, with the Kaiser's grip on power emerging tested yet unbroken. Through an uncannily lucky series of apparent gambles on when to make concessions and when to crack down brutally, the Kaiserist regime successfully neutralised most flashpoint issues.\n\nThough this episode has dealt a hefty blow to the Kaiser's quasi-divine image, the Katzenartig Imperium appears to be back on track with its reforms, albeit behind schedule."
 giga_katzen.05012.name:0 "Katzenartig Imperium Fractures!"
 giga_katzen.05012.loris.desc:0 "The deteriorating situation in the Katzenartig Imperium has taken a sudden turn, with the Kaiser having disappeared! In the chaotic situation, there is no knowing which of many jostling factions may have deposed him, or whether the Kaiser himself saw the writing on the wall and organised a clean escape from his crumbling project. In any case, without the Kaiser, his regime has utterly collapsed.\n\nKatzen space has now broken down into a vicious civil war between four factions: the §Y[katzen_civil_war_realm.GetName]§!, §Y[katzen_civil_war_republic.GetName]§!, §Y[katzen_civil_war_socialist.GetName]§! and §Y[katzen_civil_war_junta.GetName]§!. Each self-proclaimed rightful successor is led by a prominent leader from the late Imperium, with irreconcilable visions of how to rebuild the Katzen state.\n\nImpressively, Loris von Kattensbach - previously governor of Flusion - has managed to carve out a relatively stable neutral zone around Flusion itself, the §YFlusionian Provisional Authority§!. There is a shaky understanding in ex-Katzenartig space that should the civil war be definitively resolved, the victor will reunify with Flusion's civilian government to confer legitimacy and stability. While the more pacifistic contenders led by Kibbles and Kitti Luft - who leave room to place the wellbeing of citizens first - are widely suspected to have Loris's personal sympathies, it seems the Flusionian leader is putting the preservation of Flusion's assets and Katzen unity first."
 giga_katzen.05012.douclaw.desc:0 "The deteriorating situation in the Katzenartig Imperium has taken a sudden turn, with the Kaiser having disappeared! In the chaotic situation, there is no knowing which of many jostling factions may have deposed him, or whether the Kaiser himself saw the writing on the wall and organised a clean escape from his crumbling project. In any case, without the Kaiser, his regime has utterly collapsed.\n\nKatzen space has now broken down into a vicious civil war between four factions: the §Y[katzen_civil_war_realm.GetName]§!, §Y[katzen_civil_war_republic.GetName]§!, §Y[katzen_civil_war_socialist.GetName]§! and §Y[katzen_civil_war_junta.GetName]§!. Each self-proclaimed rightful successor is led by a prominent leader from the late Imperium, with irreconcilable visions of how to rebuild the Katzen state.\n\nImpressively, Douclaw MacCathur - previously head of the Katzen admiralty - has managed to carve out a relatively stable neutral zone around Flusion itself, the §YKatzenartig Emergency Command§!. There is a shaky understanding in ex-Katzenartig space that should the civil war be definitively resolved, the victor will reunify with Flusion's military government to confer legitimacy and stability. While the more militaristic contenders led by Katlinin and Elwin - who prioritise Kaiser-like martial values - are widely suspected to have Douclaw's personal sympathies, it seems the Flusionian leader is putting the preservation of Flusion's assets and Katzen unity first."
 giga_katzen.05013.name:0 "Katzenartig Imperium Implodes!"
 giga_katzen.05013.desc:0 "The deteriorating situation in the Katzenartig Imperium has taken a sudden turn, with the Kaiser having disappeared! In the chaotic situation, there is no knowing which of many jostling factions may have deposed him, or whether the Kaiser himself saw the writing on the wall and organised a clean escape from his crumbling project. In any case, without the Kaiser, his regime has utterly collapsed.\n\nAttempts by several leaders to either seize absolute power or simply mediate the situation have all failed. With so much tension squished into the Imperium's limited territory, the result has been a complete breakdown of any recognisable central authority. There is nothing now but brutal planetary power struggles.\n\nThe great projects of the Kaiser's era are up in flames, along with the dreams of his supporters and detractors alike. While Flusion theoretically still has fearsome industrial potential, would take a political miracle for the sorry vestiges of the Imperium to return to the galactic stage anytime soon."

 flusion_consolidation_instability:0 "Reformation Woes"
 flusion_consolidation_instability_desc:0 "Dissatisfied with the Kaiser's broken promises, the population is agitating for change."