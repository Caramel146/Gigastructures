 katzen_subversion_bureaucratic:0 "Bureaucratic Subversion"
 katzen_subversion_bureaucratic_desc:0 "We are feeding the Flusionian government disinformation about our economy. Of course, our own management also suffers."

 katzen_subversion_heavyhanded:0 "Clumsy Communications"
 katzen_subversion_heavyhanded_desc:0 "An abrasive information campaign here and a cultural blunder there can ensure the Kaiser's reforms go down like a lead balloon in the public eye."

 katzen_subversion_heavyhanded_gestalt:0 "Clumsy Communications"
 katzen_subversion_heavyhanded_gestalt_desc:0 "Filtering contradictory orders about the Kaiser's ordered reforms down to our drones will impede their productivity, but also burden Flusion's administrative liaisons."

 katzen_subversion_unrest:0 "Apathetic Crackdown"
 katzen_subversion_unrest_desc:0 "Intentionally-incompetent security forces are only exacerbating protests against Katzen rule."

 katzen_subversion_unrest_gestalt:0 "Unhampered Deviancy"
 katzen_subversion_unrest_gestalt_desc:0 "We are deliberately failing to rein in deviant cells who think that overthrowing Katzen rule will protect the collective."

 katzen_planetcraft_intervention:0 "Anti-Planetcraft Interventionism"
 katzen_planetcraft_intervention_desc:0 "Mobilise the fleet! The Katzens cannot be allowed to complete their new flagship."

 giga_katzencollapse_age:0 "Collapsed Age"
 giga_katzencollapse_age_desc:0 "This civilization has lost much of its technology in a catastrophic collapse. Various warlord factions still control advanced pre-Collapse technology, but the planetary technological and industrial base is shattered. Wracked by infighting over what's left, the planet's inhabitants may continue to decline in the coming era."

 col_giga_pre_ftl_katzencollapse:0 "$giga_katzencollapse_age$"
 col_giga_pre_ftl_katzencollapse_desc:0 "$giga_katzencollapse_age_desc$"
 col_giga_pre_ftl_katzencollapse_tt:0 "$col_giga_pre_ftl_katzencollapse_desc$"

 KATZEN_COUNTRY_PROVISIONAL:0 "Katzen Rump State"
 KATZEN_COUNTRY_PROVISIONAL_DESC:0 "The [GigaFlusionProvisionalGovernmentName] is a heavily-armed sector centralised around Flusion, committed to maintaining stability in their territory."

 flusion_consolidation_instability:0 "Reformation Woes"
 flusion_consolidation_instability_desc:0 "Dissatisfied with the Kaiser's broken promises, the population is agitating for change."

 katzen_splinter_starter_boost:0 "Nationbuilding Spirit"
 katzen_civil_war_navy_boost:0 "Civilwarpilled navymaxxing"

 mod_giga_katzen_ship_cost_mult:0 "mod_giga_katzen_ship_cost_mult name"