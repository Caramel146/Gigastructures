l_english:
 giga_katzen.7000.name:0 "Strategic Shifts on Flusion"
 giga_katzen.7000.desc:0 "Recent reports from the Katzenartig Imperium all suggest that a strategic and political shift is underway. The Kaiser seems to believe that Flusion's rule has expanded far enough for the time being, and is ordering his aides to draft an array of plans for substantial administrative restructuring.\n\nWhile we shouldn't expect anything like a renunciation of Katzen militarism, it seems a respite is on the horizon for free nations on the Imperium's borders - and a tighter grip is closing for those who are already under the Kaiser's thumb.\n\nPractically, this means the Kaiser is seeking to wind down ongoing conflicts in the coming years, and will reign in his relentless expansionism. We should review the galactic situation with our new intel in case this provides any opportunities."
 giga_katzen.7000.a:0 "Very welcome news."
 giga_katzen.7000.a.tooltip:0 "The Katzens are too preoccupied to give external diplomacy as much attention, §Rhalving§! the likelihood of §YKatzen Attachés§! increasing opinion during the §BKatzen Reformation§!."
 giga_katzen.7000.b:0 "An opportunity to grow closer to Flusion?"
 giga_katzen.7000.c:0 "We're running out of time to escape Flusion's control..."
 giga_katzen.7000.d:0 "Fudge numbers to undermine their bureaucracy's planning."
 giga_katzen.7000.d.tooltip:0 "§GThis will increase the chance of the Imperium destabilising in the near future.§!" #\nThe §YKaiser's Opinion§! of us will §Rdecrease§! by 5.

 giga_katzen.7001.name:0 "Katzens Propose Peace"
 giga_katzen.7001.desc:0 "High-level incoming communications from the Katzenartig Imperium are proposing that we end our war with them, leaving the borders as they currently stand. While this is an unusual proposal from the notoriously violent and expansionistic Katzens, it isn't entirely surprising in light of their recent shift from external to internal affairs.\n\nThe peace offer seems genuine, but the Katzens have made it clear that they aren't just going soft, and are prepared to continue the war with their full effort should we refuse. Of course, if we're feeling confident, we could continue fighting for now, and ask them for peace when we're in a more favourable position..."
 giga_katzen.7001.a:0 "Continue fighting."
 giga_katzen.7001.b:0 "Begin the ceasefire."

 giga_katzen.7002.name:0 "Katzenartig Reformation Begins"
 giga_katzen.7002.desc:0 "Increasingly public information from the Katzenartig Imperium confirms that the Kaiser has gone ahead with his once-clandestine reformation plans. According to our best intel, we should expect the Kaiser to spend upwards of two decades occupied with enacting a range of far-reaching administrative reforms designed to consolidate Flusion's local and imperial authority.\n\nReform is, of course, risky business, with programs such as accelerating Katzenification and reshuffling regional political privileges particularly likely to cause backlash. Whether the Kaiser can come out of this era with his reign strengthened will depend heavily on whether his citizens and subordinates feel he has fulfilled his promises..."
 giga_katzen.7002.a:0 "Let's hope they stay this way..."
 giga_katzen.7002.b:0 "Order and we will obey."
 giga_katzen.7002.c:0 "We can only hope it all unravels."
 giga_katzen.7002.d:0 "I'm sure we could mishandle implementing a few reforms..."
 giga_katzen.7002.d.tooltip:0 "§GThis will increase the chance of the Imperium destabilising in the near future.§!" #\nThe §YKaiser's Opinion§! of us will §Rdecrease§! by 5.

 giga_katzen.7012.name:0 "Instability in Katzenartig Imperium!"
 giga_katzen.7012.desc:0 "It appears that the Katzenartig citizenry don't feel the Kaiser is delivering his utopian vision. Open unrest has broken out on the capital itself, and while the Kaiser has responded with a heavy hand to reassert his authority, a spike in high-profile treason convictions suggests that not all in the Imperium's upper echelons are enthusiastic about enforcing the Kaiser's will.\n\nDespite this test to the Kaiser's rule, it's still too soon to say whether the Kaiserist government will collapse, or reassert itself for another generation - and with the crisis playing out on numerous societal battlefields, it may be a few years before we have an answer.\n\nRegardless, during this period, the Katzenartig Imperium may not have the capacity to handle further threats, and a war could help stretch the Katzen government too far..."
 giga_katzen.7012.a:0 "Promising news."
 giga_katzen.7012.b:0 "We'll pile on the pressure!"
 giga_katzen.7012.b.tooltip:0 "We will §Rdeclare war§! on the §YKatzenartig Imperium§!. A successful offensive in the next few years will §Gincrease§! the chance of the Imperium collapsing."
 giga_katzen.7012.c:0 "Traitors! We believe in the Kaiser."
 giga_katzen.7012.c.tooltip:0 "§YSupporting or opposing the Kaiser will affect his chances of maintaining power.§!"
 giga_katzen.7012.d:0 "This may be our last chance for rebellion!"
 giga_katzen.7012.d.tooltip:0 "$giga_katzen.0033.a.tooltip$\n\n$giga_katzen.7012.c.tooltip$"
 giga_katzen.7012.e:0 "Our population will overthrow Flusion from within!"
 giga_katzen.7012.e.tooltip:0 "§GThis will increase the chance of the Imperium further destabilising in the near future.§!" #\nThe §YKaiser's Opinion§! of us will §Rdecrease§! by 5.

 giga_katzen.7013.name:0 "Kaiser Maintains Power"
 giga_katzen.7013.desc:0 "Recent unrest in the Katzenartig Imperium has wound down, with the Kaiser's grip on power emerging tested yet unbroken. Through an uncannily lucky series of apparent gambles on when to make concessions and when to crack down brutally, the Kaiserist regime successfully neutralised most flashpoint issues.\n\nThough this episode has dealt a hefty blow to the Kaiser's quasi-divine image, the Katzenartig Imperium appears to be back on track with its reforms, albeit behind schedule."
 giga_katzen.7013.a:0 "Blast!"
 giga_katzen.7013.b:0 "Righteousness wins today."
 giga_katzen.7013.c:0 "We missed our chance..."

 giga_katzen.7014.name:0 "Katzenartig Imperium Implodes!"
 giga_katzen.7014.desc:0 "The deteriorating situation in the Katzenartig Imperium has taken a sudden turn, with the Kaiser having disappeared! In the chaotic situation, there is no knowing which of many jostling factions may have deposed him, or whether the Kaiser himself saw the writing on the wall and organised a clean escape from his crumbling project. In any case, without the Kaiser, his regime has utterly collapsed.\n\nAttempts by several leaders to either seize absolute power or simply mediate the situation have all failed. With so much tension squished into the Imperium's limited territory, the result has been a complete breakdown of any recognisable central authority. There is nothing now but brutal planetary power struggles.\n\nThe great projects of the Kaiser's era are up in flames, along with the dreams of his supporters and detractors alike. While Flusion theoretically still has fearsome industrial potential, would take a political miracle for the sorry vestiges of the Imperium to return to the galactic stage anytime soon."
 giga_katzen.7014.b:0 "Their violent ways brought such a horrible end..."

 giga_katzen.7020.name:0 "Katzenartig Imperium Fractures!"
 giga_katzen.7020.loris.desc:0 "The deteriorating situation in the Katzenartig Imperium has taken a sudden turn, with the Kaiser having disappeared! In the chaotic situation, there is no knowing which of many jostling factions may have deposed him, or whether the Kaiser himself saw the writing on the wall and organised a clean escape from his crumbling project. In any case, without the Kaiser, his regime has utterly collapsed.\n\nKatzen space has now broken down into the vicious §YKatzen Civil War§! between four factions: the §Y[katzen_civil_war_realm.GetName]§!, §Y[katzen_civil_war_republic.GetName]§!, §Y[katzen_civil_war_socialist.GetName]§! and §Y[katzen_civil_war_junta.GetName]§!. Each self-proclaimed rightful successor is led by a prominent leader from the late Imperium, with irreconcilable visions of how to rebuild the Katzen state.\n\nImpressively, Loris von Kattensbach - previously governor of Flusion - has managed to carve out a relatively stable neutral zone around Flusion itself, the §YFlusionian Provisional Authority§!. There is a shaky understanding in ex-Katzenartig space that should the civil war be definitively resolved, the victor will reunify with Flusion's civilian government to confer legitimacy and stability. While the more pacifistic contenders led by Kibbles and Kitti Luft - who leave room to place the wellbeing of citizens first - are widely suspected to have Loris's personal sympathies, it seems the Flusionian leader is putting the preservation of Flusion's assets and Katzen unity first."
 giga_katzen.7020.douclaw.desc:0 "The deteriorating situation in the Katzenartig Imperium has taken a sudden turn, with the Kaiser having disappeared! In the chaotic situation, there is no knowing which of many jostling factions may have deposed him, or whether the Kaiser himself saw the writing on the wall and organised a clean escape from his crumbling project. In any case, without the Kaiser, his regime has utterly collapsed.\n\nKatzen space has now broken down into the vicious §YKatzen Civil War§! between four factions: the §Y[katzen_civil_war_realm.GetName]§!, §Y[katzen_civil_war_republic.GetName]§!, §Y[katzen_civil_war_socialist.GetName]§! and §Y[katzen_civil_war_junta.GetName]§!. Each self-proclaimed rightful successor is led by a prominent leader from the late Imperium, with irreconcilable visions of how to rebuild the Katzen state.\n\nImpressively, Douclaw MacCathur - previously head of the Katzen admiralty - has managed to carve out a relatively stable neutral zone around Flusion itself, the §YKatzenartig Emergency Command§!. There is a shaky understanding in ex-Katzenartig space that should the civil war be definitively resolved, the victor will reunify with Flusion's military government to confer legitimacy and stability. While the more militaristic contenders led by Katlinin and Elwin - who prioritise Kaiser-like martial values - are widely suspected to have Douclaw's personal sympathies, it seems the Flusionian leader is putting the preservation of Flusion's assets and Katzen unity first."
 giga_katzen.7020.b:0 "Snivelling traitors have stolen our future!"
 giga_katzen.7020.b.tooltip:0 "§RWe have become independent.§!"
 giga_katzen.7020.c:0 "Free again, at last!"
 giga_katzen.7020.c.tooltip:0 "§GWe have become independent.§!"

 giga_katzen.7021.name:0 "[GigaFlusionProvisionalGovernmentName]"
 giga_katzen.7021.name.loris:0 "Flusionian Provisional Authority"
 giga_katzen.7021.name.douclaw:0 "Katzenartig Emergency Command"
 giga_katzen.7021.intro.loris.desc:0 "Greetings again from Flusion, aliens. §YDouclaw MacCathur§! here, speaking on behalf of our current leader §YLoris von Kattensbach§!.\n\nThanks to Loris's work, we've managed to shield Flusion and its direct territories from the civil war, and we intend to keep their people safe until the Katzen state reunifies.\n\nWe don't want any conflict with outsiders, but as always, we are more than ready to protect ourselves."
 giga_katzen.7021.intro.douclaw.desc:0 "Greetings again from Flusion, aliens. §YDouclaw MacCathur§! here, leader of the Imperium's interim government.\n\nThanks to the military's swift action, we've managed to shield Flusion and its direct territories from the civil war, and we intend to keep these lands safe until the Katzen state reunifies.\n\nWe don't want any conflict with outsiders, but as always, we are more than ready to protect ourselves."
 giga_katzen.7021.whatareyou:0 "Who is in charge of Flusion now?"
 giga_katzen.7021.whatareyou.response:0 "We, the [GigaFlusionProvisionalGovernmentName], continue to run the direct successors of the Katzenartig Imperium's institutions. Our mandate is to ensure the ongoing civil war doesn't wreck our civilisation's capital here on Flusion."
 giga_katzen.7021.howalive:0 "How did the [GigaFlusionProvisionalGovernmentName] come to be?"
 giga_katzen.7021.howalive.loris.response:0 "We barely rode out the chaos in the days after the Kaiser disappeared, but Loris von Kattensbach is widely respected by Flusion's diverse races, and by treating them well he's kept us all from turning on one another."
 giga_katzen.7021.howalive.douclaw.response:0 "Things were grim when the Kaiser disappeared, but I gained plenty of experience by his side, and that came in handy. I quickly gathered fellow officers who recognised the name Douclaw MacCathur as a loyal aide of the Kaiser, and we moved in to hold things together."
 giga_katzen.7021.futureplans:0 "What do you intend to do?"
 giga_katzen.7021.futureplans.response:0 "When the civil war is resolved, we'll begin the process of reunification. Flusion will be transferred from the custodianship of our stable institutions to the incoming leadership - with our advice, of course."
 giga_katzen.7021.whoseside:0 " Whose side are you on in the civil war?"
 giga_katzen.7021.whoseside.response:0 "We are very strictly neutral - and no, don't push us for more. It's a dangerous subject. You may think that each warring faction sees us as traitors, but as long as we don't take sides, they understand how important our role is here."
 giga_katzen.7021.a:0 "You're speaking to the legitimate interim government of Flusion."
 giga_katzen.7021.b:0 "Flusionian neutrality is the key to protecting our civilisation's greatest assets from fleeting power struggles."
 giga_katzen.7021.c:0 "Be assured, we are still plenty capable of defending ourselves."
 giga_katzen.7021.d:0 "The Kaiser has abandoned us, but we haven't abandoned ourselves."
 giga_katzen.7021.e:0 "Flusionkind's inheritance must not, will not, be squandered."
 giga_katzen.7021.f:0 "We on Flusion hope for a speedy resolution to the war. Well... some of us do."
 giga_katzen.7021.g:0 "Some Flusionians might prefer our current independence, but whatever our future state looks like, it first and foremost must be whole."
 giga_katzen.7021.h:0 "Stability is the highest priority."
 giga_katzen.7021.i:0 "Our civilisation will be united again, even if it looks quite different to during the Kaiser's days."
 giga_katzen.7021.j:0 "We can't take sides if you interfere in the civil war, but we will act without hesitation if you move against Flusion."
 giga_katzen.7021.k:0 "Flusionians are strong. We'll survive this too."
 giga_katzen.7021.war.a:0 "Will nothing teach you? We Katzens don't give up."
 giga_katzen.7021.war.b:0 "Do you think our martial skills vanished with the Kaiser?"
 giga_katzen.7021.war.c:0 "From Projekt Mondkanone to fighting you, nothing brings Flusionians together like a common threat."
 giga_katzen.7021.diplowar:0 "§RYou've clung on to Flusion long enough!§!"
 giga_katzen.7021.diplowar.response:0 "If we must... Come at us!"
 giga_katzen.7021.diplowar.tooltip:0 "We will §Rdeclare war§! on the §Y[GigaFlusionProvisionalGovernmentName]§!. They will accept peace at any time. Any existing Katzen Splinter States will §Rjoin the war§! against us to defend Flusion."
 cant_flusiokrieg_contender:0 "We have committed to reunifying with Flusion only through winning the Katzen Civil War."
 giga_katzen.7021.diplopeace:0 "§BLet's end this fighting, Flusionians.§!"
 giga_katzen.7021.diplopeace.response:0 "Excellent. An end to this pointless bickering."
 giga_katzen.7021.diplopeace.tooltip:0 "We will §Bend the war§! with the §Y[GigaFlusionProvisionalGovernmentName]§! and any Katzen Splinter States that are currently intervening in their defence. All current borders will be kept."

 giga_katzen.7022.name:0 "Succession"
 giga_katzen.7022.desc:0 "The Kaiser is gone, the Imperium is shattered, and the future of Katzenkind is uncertain. But we are still standing. And just a few short years ago, the word of the Kaiser was that we, too, are \"Katzens\". Katlinin, Elwin, Kibbles and Kitti Luft have made their claims of succession, but why are we any less worthy?\n\nWe are faced with a choice that will define our civilisation's history: do we walk away from the ruins of the Kaiser's project, or do we stake our claim in reunifying the Katzen state? Should we enter the §YKatzen Civil War§! and emerge victorious, the [GigaFlusionProvisionalGovernmentName]'s assets will be ours: perhaps most important among them, the legacy of Kattail will belong to our name and be clay in our [root.species.GetHandNamePlural]." #legacy of Kattail haha what could that be
 giga_katzen.7022.a:0 "We will reforge the Katzenartig Imperium."
 giga_katzen.7022.a.tooltip:0 "We will §Rjoin the§! §YKatzen Civil War§!, and should we defeat all other succession rivals, we will annex the §Y[GigaFlusionProvisionalGovernmentName]§! and become the §B[root.GetAdj] Katzimperium§!. Leaving the war will §Rnot be possible§!." # However, leaving the Katzen Civil War will only be possible by renouncing our claim, incurring §Rimmense societal penalties§!!
 giga_katzen.7022.b:0 "No. No more."
 giga_katzen.7022.b.tooltip:0 "§YThis opportunity will not come again.§!"

 giga_katzen.7023.name:0 "Assuming the Mantle"
 giga_katzen.7023.loris.desc:0 "At long last, the Katzen Civil War has come to an end. First came the chaos after the Kaiser disappeared, then years of brutal conflict, and then silence - now displaced by a thunderous roar of triumph. The visionary cries of Katlinin, Elwin, Kibbles and Kitti Luft have been drowned out in history - for with only us left standing on the battlefield, no rivals remain to contest our claims of legitimate inheritance.\n\n§YLoris von Kattensbach§! has now surrendered the custodianship of the §YFlusionian Provisional Authority§!, entrusting the heart of Katzen civilisation to us and our vision for the future. With this, the Katzen state is reborn: the galaxy now knows the §B$katzen_new_imperium_name$§!."
 giga_katzen.7023.douclaw.desc:0 "At long last, the Katzen Civil War has come to an end. First came the chaos after the Kaiser disappeared, then years of brutal conflict, and then silence - now displaced by a thunderous roar of triumph. The visionary cries of Katlinin, Elwin, Kibbles and Kitti Luft have been drowned out in history - for with only us left standing on the battlefield, no rivals remain to contest our claims of legitimate inheritance.\n\n§YDouclaw MacCathur§! has now surrendered the custodianship of the §YKatzenartig Emergency Command§!, entrusting the heart of Katzen civilisation to us and our vision for the future. With this, the Katzen state is reborn: the galaxy now knows the §B$katzen_new_imperium_name$§!."
 giga_katzen.7023.noprovisional.desc:0 "At long last, the Katzen Civil War has come to an end. First came the chaos after the Kaiser disappeared, then years of brutal conflict, and then silence - now displaced by a thunderous roar of triumph. The visionary cries of Katlinin, Elwin, Kibbles and Kitti Luft have been drowned out in history - for with only us left standing on the battlefield, no rivals remain to contest our claims of legitimate inheritance.\n\nA joyous reunion with the [GigaFlusionProvisionalGovernmentName] may have been stolen from us, but nonetheless, Katzenkind has been united again under our vision for the future. With this, the Katzen state is reborn: the galaxy now knows the §B$katzen_new_imperium_name$§!."
 giga_katzen.7023.a:0 "The Kaiser is gone, but the Imperium stands."
 giga_katzen.7023.a.tooltip:0 "We will §Gintegrate§! the §Y[GigaFlusionProvisionalGovernmentName]§! and become the §B[root.GetAdj] Katzimperium§!."
 katzen_new_imperium_name:0 "[root.GetAdj] Katzimperium"

 giga_katzen.7024.name:0 "[katzen_civil_war_player.GetName] Reunifies Katzenartig Imperium!"
 giga_katzen.7024.loris.desc:0 "With the destruction of all other belligerents of the Katzen Civil War, the §Y[katzen_civil_war_player.GetName]§! now stands as the supreme victor of the deadly feline civil conflict.\n\nAfter the civil conflict concluded, §YLoris von Kattensbach§! entered negotiations to unify the §YFlusionian Provisional Authority§! with the victorious party, culminating in the formation of the §Y[katzen_civil_war_player.GetAdj] Katzimperium§!.\n\nThis triumphant new state, recently unburdened by its Katzen rivals and now armed with the economic powerhouse of Flusion, is ascendant in galactic affairs. The question now is what vision this reformed empire has for itself and the galaxy."
 giga_katzen.7024.douclaw.desc:0 "With the destruction of all other belligerents of the Katzen Civil War, the §Y[katzen_civil_war_player.GetName]§! now stands as the supreme victor of the deadly feline civil conflict.\n\nAfter the civil conflict concluded, §YDouclaw MacCathur§! entered negotiations to unify the §YKatzenartig Emergency Command§! with the victorious party, culminating in the formation of the §Y[katzen_civil_war_player.GetAdj] Katzimperium§!.\n\nThis triumphant new state, recently unburdened by its Katzen rivals and now armed with the economic powerhouse of Flusion, is ascendant in galactic affairs. The question now is what vision this reformed empire has for itself and the galaxy."
 giga_katzen.7024.noprovisional.desc:0 "With the destruction of all other belligerents of the Katzen Civil War, the §Y[katzen_civil_war_player.GetName]§! now stands as the supreme victor of the deadly feline civil conflict.\n\nAfter the civil conflict concluded, the victorious party underwent a national metamorphosis, culminating in the emergence of the §Y[katzen_civil_war_player.GetAdj] Katzimperium§!.\n\nThis triumphant new state, recently unburdened by its Katzen rivals and now armed with the economic powerhouse of Flusion, is ascendant in galactic affairs. The question now is what vision this reformed empire has for itself and the galaxy."
 giga_katzen.7024.a:0 "Please, no more..."
 giga_katzen.7024.b:0 "We shall see what path they take."
 giga_katzen.7024.c:0 "A righteous day in history."

 giga_katzen.7031.name:0 "Katzen Planetcraft Construction on Nesar!"
 giga_katzen.7031.desc:0 "The latest child of the Kaiser's love for engineering megaprojects is now gestating on the magmatic world of §YNesar§! in the Jublio system. We already know what it is, as does the rest of the galaxy; after all, it's hard to hide turning an entire planet into a warship. Therefore, the Katzenartig Imperium has instead been loudly using this new megaproject as a unifying ambition, promising that the under-construction planetary warship - the \"§YKaiserübermacht§!\" - will be a leap forwards in Katzen history comparable to the completion of the old Kaiser Moon.\n\nOnce the Kaiser's new flagship comes online, the Kaiser Moon will become a second-rate ship, but the model won't be obsolete - rather, Kaiser Moons will §Renter general production§! in the Katzen armada, signifying new heights of Katzen military industry. Moreso, there is one key distinction between the future role of the Kaiserübermacht and the outgoing role of the Kaiser Moon: a theoretical defeat of the Kaiserübermacht §Rwill not plunge the Imperium into chaos§!. Indeed, we expect that thanks to the administrative resilience brought about by the §BReformation§!, nothing short of losing Flusion could decapitate the Kaiser's machine after that point.\n\nIf we aim to defeat the Katzen threat, we likely §Ronly have a decade§! before the Kaiserübermacht is functional and the Kaiser's galactic conquest begins anew..."
 giga_katzen.7031.ally.desc:0 "The latest child of the Kaiser's love for engineering megaprojects is now gestating on the magmatic world of §YNesar§! in the Jublio system. We already know what it is, as does the rest of the galaxy; after all, it's hard to hide turning an entire planet into a warship. Therefore, the Katzenartig Imperium has instead been loudly using this new megaproject as a unifying ambition, promising that the under-construction planetary warship - the \"§YKaiserübermacht§!\" - will be a leap forwards in Katzen history comparable to the completion of the old Kaiser Moon.\n\nOnce the Kaiser's new flagship comes online, the Kaiser Moon will become a second-rate ship, but the model won't be obsolete - rather, Kaiser Moons will §Renter general production§! in the Katzen armada, signifying new heights of Katzen military industry. Moreso, there is one key distinction between the future role of the Kaiserübermacht and the outgoing role of the Kaiser Moon: a theoretical defeat of the Kaiserübermacht §Rwill not plunge the Imperium into chaos§!. Indeed, we expect that thanks to the administrative resilience brought about by the §BReformation§!, nothing short of losing Flusion could decapitate the Kaiser's machine after that point.\n\nFor those who aim to defeat the Imperium, they likely §Ronly have a decade§! before the Kaiserübermacht is functional and the Kaiser's galactic conquest begins anew..."
 giga_katzen.7031.a:0 "Oh no..."
 giga_katzen.7031.b:0 "Stop them now, while we still have time!"
 giga_katzen.7031.b.tooltip:0 "We will §Rdeclare war§! on the Katzenartig Imperium."
 giga_katzen.7031.c:0 "Glory to the Kaiser."

 councilor_katzen_colonial_chief:0 "Colonial Consul-General"
 councilor_katzen_colonial_chief_female:0 "$councilor_katzen_colonial_chief$"
 councilor_katzen_colonial_chief_desc:1 "The $TITLE$ upholds relations between our central government and most far-flung administrations."

