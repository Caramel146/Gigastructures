l_english:

 d_katzenland_unsteady_ground: "Unsteady Ground"
 d_katzenland_unsteady_ground_desc: "The surface here is chronically unstable as a result of some cataclysmic past disruption."
 d_katzenland_glassflats: "Glassflats"
 d_katzenland_glassflats_desc: "Some unthinkably hot past event once melted the sand in this region. It became a frozen ocean of solid glass, useless for almost anything."
 d_katzenland_sandblasting_winds: "Sandblasting Winds"
 d_katzenland_sandblasting_winds_desc: "Grit-filled gusts slowly wear away at any structure (or unlucky organism) sitting in the open for too long."
 d_katzenland_frequent_simooms: "Frequent Simooms"
 d_katzenland_frequent_simooms_desc: "This region has endemic intermittent winds hot and dry enough to quickly burn living organisms."
 d_katzenland_roving_dunes: "Roving Dunes"
 d_katzenland_roving_dunes_desc: "Chokingly thick sand migrates circuitously through the various winds, periodically swamping any permanent constructions."
 d_katzenland_orographic_currents: "Orographic Currents"
 d_katzenland_orographic_currents_desc: "Reliable temperature differentials and winding mountains combine to create valleys of steady, moderate wind, ready to be harnessed."
 d_katzenland_fissile_formations: "Fissile Formations"
 d_katzenland_fissile_formations_desc: "Muffled concentrations of radiation betray the treasure trove of energetic fissile fuel hiding below the surface."
 d_katzenland_thermoconductive_bedrock: "Thermoconductive Bedrock"
 d_katzenland_thermoconductive_bedrock_desc: "The highly thermally conductive geology here is practically a natural industrial-scale heat sink."
 d_katzenland_metamorphosed_debris: "Metamorphosed Debris"
 d_katzenland_metamorphosed_debris_desc: "Energetic impacts have fused unrecognisable concentrations of metal into valuable slag."
 d_katzenland_stripped_topsoil: "Stripped Topsoil"
 d_katzenland_stripped_topsoil_desc: "Storms have devoured the dunes here, bringing the surface closer to the bedrock and the wealth it contains."
 d_katzenland_metallic_heaps: "Metallic Heaps"
 d_katzenland_metallic_heaps_desc: "Prevailing duststorms reliably deposit heavier particles here, leaving mounds of valuable metal dust in lees."
 d_katzenland_radiothermal_bore: "Radiothermal Bore"
 d_katzenland_radiothermal_bore_desc: "An aquifer of scalding water provides a welcome spring of life."
 d_katzenland_subterranean_grotto: "Subterranean Grotto"
 d_katzenland_subterranean_grotto_desc: "Thick layers of rock protect this relatively vibrant refuge from the harsh conditions on surface."
 d_katzenland_salt_lake: "Salt Lake"
 d_katzenland_salt_lake_desc: "Though exposed water quickly evaporates, thick black mud survives here beneath an insulating salt crust. Plants that can tolerate the hypersaline conditions have a monopoly over the moisture."


 origin_scorched:0 "Scorched Earth"
 origin_scorched_desc:0 "§RWARNING: Challenging Origin§!\nThis species clings on to life in an irradiated wasteland - since time immemorial, or so their oldest stories say. But now, as their archaeological capabilities grow, they must grapple with the possibility that something else came Before..." #yes that capital B is deliberate
 origin_tooltip_scorched_effects: "Start on an $pc_katzenland$ with the $trait_giga_incandescent$ trait."
 giga_start_screen_scorched:0 "Our society's oldest memories are of firestorms overhead, and gales sandblasting away our shelters. We knew nothing else. It wasn't until we turned out telescopes to distant worlds that we realised how hostile our home is for life. Driven by renewed interest in the story of life on our planet, our archaeologists are digging deep below the sands, hunting for anything that the howling winds have not destroyed..."

 trait_giga_incandescent:0 "Incandescent"
 trait_giga_incandescent_desc: "Tempered in the furnace of a scorched world, this species has an unfaltering drive to endure."
 #origin_tooltip_post_apocalyptic_effects: "- $HOMEWORLD$ ['concept_pc_nuked']$NEW_LINE$- $SPECIES_TRAITS$ ['concept_survivor']" #TODO concepts with this as a reference

