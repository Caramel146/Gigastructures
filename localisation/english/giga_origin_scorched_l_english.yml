 giga_scorched.002.name: "Out the Dustbin of History"
 giga_scorched.002.desc: "A couple years in you get the Ashes of History event, informing of revelations regarding your history being on a destroyed planetcraft and ambiguously not even from the world, and the resulting identity crisis. This begins the Immolated Origins situation."
 giga_scorched.002.a.renewal: "We must recover our lost culture!"
 giga_scorched.002.a.renewal.tooltip: "Sets situation approach to §Y$giga_situation_scorched_approach_renewal$§!. Our situation approach can be changed at any time."
 giga_scorched.002.a.synthesis: "An interesting debate."
 giga_scorched.002.a.synthesis.tooltip: "Sets situation approach to §Y$giga_situation_scorched_approach_synthesis$§!. Our situation approach can be changed at any time."
 giga_scorched.002.a.continuity: "We mustn't rewrite our culture!"
 giga_scorched.002.a.continuity.tooltip: "Sets situation approach to §Y$giga_situation_scorched_approach_continuity$§!. Our situation approach can be changed at any time."

